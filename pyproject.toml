[project]
name = "cwagent"
version = "0.1.0"
description = "LLM agent that plays Honkai: Star Rail's Currency Wars mode"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
# 依赖随功能逐步加入,完整清单见 docs/TECH_DESIGN.md 第 15 节。
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3",
    "mss>=9.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.0",
    "pillow>=10.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidocr>=3.10.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    "vgamepad>=0.2; sys_platform == 'win32'",   # 虚拟手柄开晶矿(驱动 ViGEmBus 由 cwagent 自动安装)
]

[project.scripts]
cwagent = "cwagent.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# 只用 uv 管理的 Python,版本固定在 .python-version。
# 固定到补丁号很重要:agent 需以管理员身份运行(游戏是提权进程),而 Windows 上管理员进程无法穿过
# uv 为「次版本号」建立的目录联接(os error 448);固定补丁号时虚拟环境会直接指向真实安装目录。
python-preference = "only-managed"

# vgamepad 只有源码包,构建时如果本机没有 ViGEmBus 会弹出驱动安装程序;跳过,驱动由 cwagent 自己按需安装和卸载
[tool.uv.extra-build-variables]
vgamepad = { VGAMEPAD_SKIP_VIGEMBUS_INSTALL = "true" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fastapi 的 TestClient 仍依赖 httpx,与本项目无关的弃用提示
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
