# 敌人词条(位面详情底部那一排):随仓库发布,人工核对过。本机对局中读到的在 data/affixes.local.yaml,
# 核对后用 `cwagent affixes export` 挪到这里。
#
# 说明文字来自游戏内词条面板。OCR 会把面板上的图标读成字(开头的「图」「向回」「图回」之类),
# 导出时已经去掉;对不上游戏原文时以游戏为准。

- name: 侵蚀·随从强化
  desc: 普通和精英敌人有概率被贪饕侵蚀。普通和精英敌人获得强化,速度提高 60%,生命上限提高 30%。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 霸凌弱者
  desc: 敌人对 1 星的我方队员造成的伤害提高 20%。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 正当防卫
  desc: 敌人受到我方前台攻击时,对施放攻击的我方目标造成等同于 100% 攻击力的伤害,该伤害无法消灭我方目标。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 兵临城下
  desc: 敌方目标回合开始时,使敌方全体造成的伤害提高 10%,上限 10 层。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 供不应求
  desc: 商店中有 10% 概率出现【卖掉了】,【卖掉了】将占用一个商店栏位。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 同步行动
  desc: 我方小队获得行动提前效果时,随机使一名精英/首领敌人行动提前 20%。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 紧急止血
  desc: 敌方目标进入战斗时受到 20% 生命上限的伤害,行动后回复 15% 生命上限的生命值,最多 3 次。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 第一位面强化
  desc: 第一位面中的敌人获得强化,速度提高 20%,生命上限提高 20%。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 战个痛快
  desc: 战斗节点的倒计时减少 30,但首领节点的倒计时增加 20。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 重症难题
  desc: 我方前台受到攻击后,治疗强度和护盾强度降低 50%,持续 1 回合。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 融资危机
  desc: 刷新商店的基础价格变为 3 金币,刷新 30 次或达到 9 级后恢复为 2 金币。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 时间刺客
  desc: 战斗节点会出现时间刺客,它的攻击会削减 7 点倒计时。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 重复熄火
  desc: 敌方全体每共计行动 7 次后,使我方全体熄火,下次攻击只能造成 1 点伤害,施放 1 次攻击后解除。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 冷冻冬眠
  desc: 我方小队受到致命攻击时,若未陷入无法战斗状态,则会陷入冻结状态,持续 2 回合。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 永久创伤
  desc: 我方小队生命值降低时,会减少等同于生命值降低值 20% 的生命上限,最多降低生命上限的 60%。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 前台熄火
  desc: 进入战斗时,我方前台造成伤害时只能造成 1 点伤害,施放 1 次攻击后解除。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 免死金牌
  desc: 敌人受到攻击期间,若生命值百分比小于 1%,使当前生命值变为生命上限的 10%,并在本次攻击内不会降低至该值以下,每名敌人只能触发 1 次该效果。
  source: 游戏内词条(2026-11-16 实机 OCR)

- name: 首领强化
  desc: 首领敌人获得强化,速度提高 60%,生命上限提高 30%。
  source: 游戏内词条(2026-11-17 实机 OCR)

- name: 榜样激励
  desc: 伤害统计排名第一的队员造成的伤害为原伤害的 75%,其他队员造成的伤害为原伤害的 110%。
  source: 游戏内词条(2026-11-17 实机 OCR)

- name: 净化身心
  desc: 当敌人生命值百分比首次小于 50% 时,解除所有负面效果并回复等同于生命上限 10% 的生命值,每解除 1 个负面效果,额外回复 2%。
  source: 游戏内词条(2026-11-17 实机 OCR,开头混进的首领节点说明已去掉)

- name: 丢失幸运
  desc: 我方小队的幸运一击率降低 25%。
  source: 游戏内词条(2026-11-17 实机 OCR)

- name: 吸星魔王
  desc: 禁用该词缀左侧的所有词缀,每禁用一个,使首领节点敌人生命提高 30%,速度提高 30%,造成的伤害提高 30%。
  source: 游戏内词条(2026-11-17 实机 OCR)

- name: 追忆时耗
  desc: 我方召唤忆灵时,削减 5 点倒计时。
  source: 游戏内词条(2026-11-17 实机 OCR)

- name: 随从强化
  desc: 普通和精英敌人获得强化,速度提高 30%,生命上限提高 20%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 额外打击
  desc: 我方队员每有 1 个空缺装备栏,受到敌人攻击后,额外受到本次攻击伤害 8% 的真实伤害。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 能量逃逸
  desc: 敌人受到攻击后,使攻击者能量降低 4 点,如果能量达到上限则不降低。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 一鼓作气
  desc: 敌人首次行动后,行动提前 100%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 侵蚀·第一位面强化
  desc: 第一位面中的敌人有概率被贪饕侵蚀。第一位面中的敌人获得强化,速度提高 20%,生命上限提高 20%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 开局不利
  desc: 游戏开始时,小队生命值减少 20 点。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 库藏生锈
  desc: 备战席的物品栏中每有一件装备没有被穿戴,敌方造成的伤害提高 3%,受到的伤害降低 4%,最多计入 10 件。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 忍无可忍
  desc: 敌人受到 7 次攻击后,行动提前 100%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 忽快忽慢
  desc: 战斗开始时,速度增幅最高的两名我方角色降低 40% 速度增幅,最低的两名我方角色提高 25% 速度增幅。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 应激反应
  desc: 敌人的生命值百分比降低至小于 50% 时,行动提前 100%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 恶意狂化
  desc: 每个位面额外使一个节点变为狂化节点,狂化敌人的生命/速度/造成的伤害额外提高 20%/20%/20%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 侵蚀·第二位面强化
  desc: 第二位面中的敌人有概率被贪饕侵蚀。第二位面中的敌人获得强化,速度提高 40%,生命上限提高 25%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 笑面可惩
  desc: 敌方目标攻击后,减少 10 笑点。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 过热保护
  desc: 我方前台角色连续行动后,有 24% 概率陷入冻结状态。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 第二位面强化
  desc: 第二位面中的敌人获得强化,速度提高 40%,生命上限提高 25%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 破而后立
  desc: 敌方目标被击破后,行动提前 20%,造成的伤害提高 40%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 沉重脚步
  desc: 敌人攻击我方队员后,使受到攻击的我方队员行动延后 8%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 小队生命刺客
  desc: 战斗节点会出现小队生命刺客,它的攻击会削减 2 点小队生命值。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 第三位面强化
  desc: 第三位面中的敌人获得强化,速度提高 60%,生命上限提高 30%。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 区别对待
  desc: 我方小队 1/2/3 星及以上队员,造成等同于 80%/90%/105% 原伤害的伤害。
  source: 游戏内词条(2026-11-18 实机截图核对)

- name: 决战在即
  desc: 首领节点的倒计时减少 30,但遭遇节点的倒计时增加 20。
  source: 游戏内词条(2026-11-18 实机 OCR)

- name: 霸占舞台
  desc: 【主角光环】持有者造成 105% 原伤害,其他角色造成 80% 原伤害。
  source: 游戏内词条(2026-11-19 实机 OCR)

- name: 坠入陷阱
  desc: 战斗开始时,我方前台有 40% 基础概率陷入禁锢、纠缠状态,使其行动延后 20%,持续 1 回合。
  source: 游戏内词条(2026-11-19 实机 OCR)

- name: 后台熄火
  desc: 进入战斗时,我方后台造成伤害时只能造成 1 点伤害,施放 1 次攻击后解除。
  source: 游戏内词条(2026-11-19 实机 OCR)

- name: 变宝为废
  desc: 每个位面开始时,首次合成的进阶装备会有 50% 的概率变成垃圾袋。
  source: 游戏内词条(2026-11-19 实机 OCR)

- name: 灼热轰炸
  desc: 进入战斗时,我方前台在场的第一位角色受到攻击的概率大幅提高。敌人施放攻击后,使攻击目标陷入灼烧状态,回合开始时受到等同于生命上限 12% 的火属性持续伤害,持续 3 回合,该灼烧状态可叠加。
  source: 游戏内词条(2026-11-19 实机 OCR,开头混进的首领节点说明已去掉,待核对)
