# 敌人词条(位面详情底部那一排):随仓库发布,人工核对过。本机对局中读到的在 data/affixes.local.yaml,
# 核对后用 `cwagent affixes export` 挪到这里。
#
# 说明文字来自游戏内词条面板。OCR 会把面板上的图标读成字(开头的「图」「向回」「图回」之类),
# 导出时已经去掉;对不上游戏原文时以游戏为准。

- name: 侵蚀·随从强化
  desc: 普通和精英敌人有概率被贪饕侵蚀。普通和精英敌人获得强化,速度提高 60%,生命上限提高 30%。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 霸凌弱者
  desc: 敌人对 1 星的我方队员造成的伤害提高 20%。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 正当防卫
  desc: 敌人受到我方前台攻击时,对施放攻击的我方目标造成等同于 100% 攻击力的伤害,该伤害无法消灭我方目标。
  source: 游戏内词条第 1 位面(2026-11-16 实机)

- name: 兵临城下
  desc: 敌方目标回合开始时,使敌方全体造成的伤害提高 10%,上限 10 层。
  source: 游戏内词条第 1 位面(2026-11-16 实机)
