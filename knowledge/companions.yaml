    - 奖励节点变为「幕后茶歇」
    - 第一位面最后一个奖励节点替换为「幕后茶歇」
  screens: [tea_break]
  verified: true
  source: 维护者告知(2026-11-14);游戏内「主角光环与奇遇详情」气泡(2026-11-16 实机)

