# 奇遇伙伴(S2「入画奇航」)。官方接口没有奇遇数据,这里人工整理,`cwagent knowledge sync` 时读入知识库。
#
# 字段:
#   name          名称
#   type          类型(装备 / 资源 / 节点,待核实)
#   desc          效果描述原文(从游戏内抄录)
#   flow_effects  对流程的影响:新节点、新界面、节点替换等,一条一句
#   screens       带来的专属界面,对应 docs/TECH_DESIGN.md 6.2 的界面名(如 tea_break、commission)
#   verified      是否已对照游戏内核实
#   source        信息来源
#
# 伙伴很多、维护者也没有全部解锁,所以不事先采集完整列表:对局中遇到一个就自动记进本机档案
# data/companions.local.yaml,核对后用 `cwagent companions export <名称>` 导出到这里。

- name: 三月兔
  type: ""
  desc: 你会在幕后茶歇遇到三月兔。第一位面的最后的奖励节点将替换为幕后茶歇。
  flow_effects:
    - 奖励节点变为「幕后茶歇」
    - 第一位面最后一个奖励节点替换为「幕后茶歇」
  screens: [tea_break]
  verified: true
  source: 维护者告知(2026-11-14);游戏内「主角光环与奇遇详情」气泡(2026-11-16 实机)

- name: 不死狼
  type: ""
  desc: 不死狼将在【幕后茶歇】找你聊聊新的委托。本局将出现【幕后茶歇】奖励节点
  flow_effects:
    - 本局出现【幕后茶歇】奖励节点
    - 在幕后茶歇接取「委托」
    - 每局的奇遇不一定相同:也见过「不死狼为你接下了一项委托。」,1-1 时本局奇遇显示「???」
  screens: [tea_break, commission]
  verified: true
  source: 游戏内「主角光环与奇遇详情」(2026-11-14 实测,2026-11-18 实机截图);维护者告知

- name: 泡泡狼
  type: ""
  desc: 泡泡狼正在悄悄骇入……骇入了节点系统!所有狂化节点都变成弱化节点了!
  flow_effects:
    - 所有狂化节点变为弱化节点
    - 投资策略出现「选择一个 / 两个都带走」布局:左侧 1 张,右侧 2 张一起选择(M7A 资料,可能是另一种奇遇)
    - 右侧两张投资策略共用一个刷新按钮
  screens: [strategy_choice]
  verified: false
  source: 游戏内「主角光环与奇遇详情」(2026-11-18 实机截图);配对投资策略界面来自 M7A v2026.11.18,待游戏内核实

- name: 杨叔
  type: ""
  desc: 杨叔发动黑洞之力!备战席随机出现持续 1 节点的【黑洞乱流格】,进入新节点时,站在【黑洞乱流格】上的角色变为相同费用的新角色。
  flow_effects:
    - 后台有杨叔头像的奇遇占位单位,与佩佩区分;不能拖动或出售
    - 进入新节点时,站在【黑洞乱流格】上的角色变成同费用的新角色
    - 每局的奇遇不一定相同:也见过「杨叔准备好了机械支援计划。杨叔会在指定节点调度机械支援。」
  screens: []
  verified: false
  source: 维护者确认 2026-11-17 对局后台头像身份;两种奇遇的说明来自 2026-11-14~17 实机 OCR(没有留截图),待游戏内核实

