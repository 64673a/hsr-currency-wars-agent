- id: m-20261118-cyrene-trial-perpetual
  kind: 机制
  title: 试用昔涟要戴「永动机」才放得出终结技
  content: |-
    试用版昔涟(账号里没有、局内给的试用版,卡面标「试用」)不戴「永动机」整局都放不出终结技,
    也就提供不了辅助效果。
    要用试用昔涟当辅助就优先给她永动机;拿不到永动机,别把阵容押在她的终结技上。
  triggers:
