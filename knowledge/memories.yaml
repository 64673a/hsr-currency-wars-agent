- id: m-20261120-spotlight-stage-plan
  kind: 打法
  title: 主角光环分阶段选:第一位面优先经济/经验光环,中后期再找主 C 战力光环,别刷空经济
  content: |-
    选主角光环可按位面分阶段取舍:
    - 第一位面首领(1-9):优先拿经济或经验类光环(领猎人、全勤底薪、战场学者、战场学者·精英等)帮前中期发育,或选能用的即战力过渡,不要为了赌某一个特定光环把金币全刷空。
    - 第二位面首领(2-7)及进入第二位面后的重选机会:再给主 C 找核心战力光环(前台专家、疾行派对客、天选幸运儿、战技精英、终结火铳、枯海行者、灵魂打击者、逐日等),或把前期的经济光环重选换成战力光环;辅助位常用黑洞引力、信心激励、飞速进场、虚弱猎手、毒药专家。
