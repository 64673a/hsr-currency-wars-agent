- id: m-20261120-affix-overheat
  kind: 打法
  title: 「过热保护」克制高频连动主 C,需避开或补「胜利之旗」免控
  content: |-
    怪物词条「过热保护」让前台角色连续行动后有 24% 概率被冻结,极度克制那刻夏、镜流、飞霄、黄泉等高频连动或高频拉条主 C。
    遇到这个词条时,优先避开纯连动体系,或者合成「胜利之旗」提供全队免控次数来反制冻结。
