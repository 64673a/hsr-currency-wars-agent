- id: m-20261120-boots-on-backline
  kind: 打法
  title: 「反重力皮靴」不止给主 C,后台高频辅助穿双鞋/三鞋收益极高
  content: |-
    反重力皮靴在大量阵容里主要穿在后台高频辅助身上(如寒鸦、爻光、真珠、风堇、开拓者、刻律德菈)。
    给后台关键辅助叠加两双甚至三双反重力皮靴,可让他们极速跑条,持续为主 C 刷速度、能量、笑点与增益;基础散件里轮滑鞋、折叠小刀、光能电池跨体系最稀缺。
