- id: m-20261120-early-transition
  kind: 打法
  title: 前期可用「持续伤害+仙舟/奇美拉」或「2 开拓银轨」过渡,装备先给打工 C 再免费继承
  content: |-
    约半数阵容的最终主 C 前期不在场,可先用两条通用路线过渡再转型:
    1. 基础伤害路线(低练度或试用最稳):「3/5 持续伤害」配「2/4 仙舟舰队」或「3 奇兽花园」,靠羁绊自带基础伤害稳血,不吃主 C 星级与练度;前期有装备先穿给场上角色,顺便给仙舟战舰升级。
    2. 经济/直伤路线:「2 开拓银轨」配强力 1 费直伤 C(瓦尔特、那刻夏,或自有且点出奇缘星魂的景元;注意试用角色没有奇缘星魂,试用景元不能按奇缘星魂强度估)。
    前中期人口有空位时可挂「赛飞儿」在后台叠翻飞之币赚金币,大后期再换通拐或生存位。未来主 C 的输出装备先给打工 C 穿,主 C 到手后卖掉打工 C,装备免费回装备栏继承。
  triggers:
    screens: [prepare]
  scope: [战术, 战略]
  status: approved
  confidence: medium
  source: 官方攻略统计(300篇,2026-11-20);对照知识库核对

- id: m-20261120-econ-roll-tempo
  kind: 打法
  title: 经济与搜牌按主 C 费用分流:高费 C 速升 8/9,低费 C 卡级搜,辅助不追 3 星
  content: |-
    搜牌与升人口节奏按最终主 C 费用分流:1 费主 C 在 4~5 级搜,2 费主 C 在 6 级搜,3 费主 C 在 7 级搜;4/5 费主 C 前中期少 D 或不 D 牌,卡 50 金币吃满利息用多余金币买经验速升 8/9 级再大搜转型。
    星级与血量取舍:部分 1 费机制/叠层主 C(如那刻夏、连击瓦尔特、自有奇缘星魂景元)2 星配好装备即可锁血拉人口,不必硬追 3 星拖垮高费通拐节奏;非主 C 辅助和凑羁绊卡 1~2 星就够用,不要追 3 星。
    卡 50 吃利息是常态,但连胜将断、血线告急或关键节点缺 2 星主 C 时应果断断利息补战力。遭遇节点未成型、保连胜时优先选低难度,大成或需要血牛叠层时再选高难度。
  triggers:
    screens: [prepare]
  scope: [战术, 战略]
  status: approved
  confidence: medium
  source: 官方攻略统计(300篇,2026-11-20);对照知识库核对

- id: m-20261120-affix-trash-craft
  kind: 打法
  title: 「变宝为废」每位面只影响首次合成,先用次要散件垫刀再合核心装
  content: |-
    怪物词条「变宝为废」会让每个位面第一次合成进阶装备时有 50% 概率变成垃圾袋。
    应对方式是主动垫刀:每个位面第一次合成进阶装备时,先用无关紧要的散件合成吃掉首次风险,不要把永动机、火力风暴潮、星徽等最关键的核心装备当成该位面的第一件合成。
  triggers:
    entities: [变宝为废]
  scope: [战术, 战略]
  status: approved
  confidence: medium
  source: 官方攻略统计(300篇,2026-11-20);对照知识库核对

- id: m-20261120-affix-financing-crisis
  kind: 打法
  title: 「融资危机」克制低费赌 3 星,优先转少 D 牌速升 8/9 级运营
  content: |-
    怪物词条「融资危机」会让刷新商店费用变为 3 金币,直到累计刷新 30 次或升到 9 级才恢复。
    这个词条极度克制 5/6/7 级反复 D 牌赌低费 3 星的体系;遇到它时优先走少 D 牌、靠过渡阵容卡利息速升 8/9 级的运营阵容(升到 9 级自动解除)。
