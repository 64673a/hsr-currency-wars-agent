- id: m-20261120-affix-counter-synergy
  kind: 打法
  title: 「忍无可忍」「永久创伤」「正当防卫」可反向利好反击队和刃
  content: |-
    「忍无可忍」(敌人受击多次立刻行动)、「永久创伤」(扣血降生命上限)、「正当防卫」(前台攻击受反伤)对常规阵容压力很大,但可以反向利用:
    「忍无可忍」让敌人高频出手,反而大幅提升反击队(万敌、刃、云璃、反击白厄)的触发频率;「永久创伤」和「正当防卫」对「刃」是强正向词条,能高频触发他的掉血追击与幻造巨铠叠层。
  triggers:
