- id: m-20261114-reward-rules
  kind: 机制
  title: 奖励节点不限行动值、阵亡无限复活,不会失败且正常吃利息
  content: |-
    奖励节点的战斗没有行动值限制,我方角色阵亡后可以无限复活,不会失败(不扣小队生命,不会断连胜),结算时同样正常吃利息。
    适合需要长时间战斗才能见效的打法(例如靠反复施放终结技叠永久增益的角色)。
    注意:投资环境「经济过热」「经济严重过热」会把奖励节点换成次元扑满主题,规则不同,见相关记忆。
  triggers:
    nodes: [reward]
  scope: [战术, 战略]
  status: approved
  confidence: high
  source: 维护者(2026-11-14、2026-11-20);「无限行动值」见游戏内节点说明,「阵亡无限复活」「正常吃利息」维护者确认

- id: m-20261114-piggy-bank
  kind: 打法
  title: 次元扑满主题的奖励节点要上有输出的阵容去「抓猪」
  content: |-
    「经济过热」把全部奖励节点换成次元扑满主题,「经济严重过热」换成超级次元扑满主题(官方描述:掉落超多战利品,但跑得超快)。
    普通奖励节点随便上几个角色就行,扑满节点则要有一定战力:输出不足(例如只上 1 费角色)会让扑满逃跑,损失大量战利品。
    进入这类奖励节点前把主力输出放上场;战前查看敌方信息,尽量让我方属性对上扑满的弱点。
    选投资环境时也要考虑:前期阵容弱时选「经济严重过热」,奖励节点可能抓不到猪,有玩家建议慎选。
  triggers:
    entities: [经济严重过热, 经济过热, 次元扑满, 扑满]
  scope: [选择, 战术, 战略]
  status: approved
  confidence: medium
  source: 维护者(2026-11-14);玩家攻略(今日头条「货币战争技巧攻略」、B 站视频 BV1TSkkBMEkE)

- id: m-20261114-armory-box-hold
  kind: 打法
  title: 简易武装箱可以先屯着,拿到配方的另一件再开
  content: |-
    简易武装箱不开时选项不变(点开看过、点棋盘空白收起,箱子和选项都还在)。
    可以先留着,等从别的渠道拿到某件简易装备,再开箱选能和它合成进阶装备的那件;过早开箱只能赌一件。
    代价是箱子一直占一个备战席格子。
  triggers:
    entities: [武装箱]
  scope: [战术]
  status: approved
  confidence: medium
  source: 维护者(2026-11-14)

- id: m-20261114-feiying-stack
  kind: 打法
  title: 绯英可以在奖励节点单独上场,压低伤害多放终结技叠永久增伤
  content: |-
    绯英施放终结技时永久提高伤害增幅(官方描述),层数在之后的战斗中保留。
    奖励节点不限行动值、阵亡可无限复活,可以利用这一点:在奖励节点只让绯英上场(其他角色移到备战席),不给她或队伍堆增伤,刻意让战斗拖长,多施放终结技来叠层;奖励节点结束后再把正常阵容摆回来。
    扑满主题的奖励节点不适用(扑满会逃跑,需要正常输出)。
  triggers:
    entities: [绯英]
  scope: [战术, 战略]
  status: approved
  confidence: medium
  source: 维护者(2026-11-14),待实战验证

- id: m-20261114-energy-escape
  kind: 机制
  title: 怪物词条「能量逃逸」让靠能量开大的主 C 很难打
  content: |-
    A8 起每局有 4 个怪物词条,会显著影响阵容选择。「能量逃逸」会让依靠能量施放终结技的主 C 很难打出输出,特殊能量不受影响。
    遇到这个词条时,优先选择不依赖普通能量开大的主 C(例如靠特殊能量、普攻、战技、追加攻击或持续伤害输出的角色),或者准备能量相关的装备与羁绊来弥补。
  triggers:
    entities: [能量逃逸]
  scope: [战略, 战术, 选择]
  status: approved
  confidence: medium
  source: 维护者(2026-11-14)

- id: m-20261114-carry-by-role
  kind: 教训
  title: 主 C 要按角色定位和技能来定,开拓者是辅助
  content: |-
    定主 C、分输出装备前先看角色的定位标签和技能:定位是「输出」、技能直接造成伤害的才适合当主 C。
    开拓者在货币战争里是辅助(技能「人气主播」让终结技目标再放一次终结技或获得额外回合、提高其他队员伤害),
    不要把他当主 C 培养,也不要给他堆输出装备;他的价值在于给真正的主 C 加速、加伤害。
  triggers:
    entities: [开拓者]
  scope: [战术, 战略]
  status: approved
  confidence: high
  source: 维护者(2026-11-14)
  evidence: ["2026-11-14 对局:模型把开拓者当主 C,反重力皮靴等输出装备都给了他"]

- id: m-20261116-invest-refresh-use
  kind: 打法
  title: 投资环境和投资策略的刷新次数过了这个界面就作废,不合用就先刷掉再看
  content: |-
    投资环境整局只在开局选这一次,底部那 1 次刷新(三张全换)过了这个界面就没用了:三张里有合用的就直接选,三张都一般就刷新。
    投资策略每张卡下面各有自己的刷新次数(只换这一张),每次进入选择界面重新给、不用就作废:不合用的那张先刷掉再看,不要直接确认。
  triggers:
    screens: [environment_choice, strategy_choice]
  scope: [战略]
  status: approved
  confidence: high
  source: 维护者(2026-11-16)
  evidence: ["2026-11-16 对局:提示写「整局的次数有限」时,模型把刷新次数留着不用,三张一般也直接确认"]

- id: m-20261116-support-over-dps
  kind: 打法
  title: 上多个输出不如给主 C 配拐,适配哪种拐看攻略那一篇
  content: |-
    人口有限时,与其再塞一个输出,不如给已经在打的主 C 配一个能放大他的拐(辅助)。
    拐的增益是乘在主 C 身上的(例如让主 C 立即行动、加暴击伤害、提高前台强度、减敌人防御),
    多一个同档输出只是多一份基础伤害,还占掉一格人口;主 C 升过一次星之后差距更明显。
    每个主 C 适配的拐不一样:直接看攻略参考里那一篇的最终阵容,里面列出来的辅助就是这套阵容的拐。
    判断谁是拐:角色条目里「定位」写着 辅助 / 治疗 / 生存 的就是,不要给他们堆输出装备;
    同理,为了凑羁绊硬上一个对主 C 毫无增益的角色,不如把位置留给拐。
  triggers:
    entities: [景元, 星期日, 黄泉, 遐蝶, 花火, 知更鸟•晴歌, 刻律德菈]
    nodes: [battle, boss, encounter]
  scope: [战术, 战略]
  status: approved
  confidence: medium
  source: 维护者(2026-11-16)告知;配合攻略卡里各主 C 的最终阵容使用,实际收益待实机统计

- id: m-20261116-front-full
  kind: 打法
  title: 前台 4 格尽量站满,人太少等于把伤害集中给少数角色
  content: |-
    前台固定 4 格,尽量站满。前台空着的时候,敌人的攻击全部落在场上那几个目标身上:
    同样的阵容,站 2 个人挨的每一击都比站 4 个人重,阵亡概率大幅上升;而阵亡一次立刻扣 35 行动值
    (两个同时阵亡扣 70),行动值提前耗尽就是输。这是打输最常见的原因,比输出不够更隐蔽。
    做法:上场人数够就把前台 3、4 号格填上——优先填角色卡上写明能站前台的角色(「前后台」或「前台」);
    辅助/治疗只要能站前台也可以去占位分摊伤害,不要因为「他是后台角色」就只放在后台。
    实在没有合适的人,上一个弱角色占位也比空着强;空着的格子不产生任何收益。
  triggers:
    nodes: [battle, boss, encounter]
  scope: [战术]
  status: approved
  confidence: high
  source: 维护者(2026-11-16)告知;与规则卡里「阵亡一次行动值 -35」一致

- id: m-20261116-piggy-chase
  kind: 打法
  title: 抓次元扑满要带「基础伤害」的羁绊或击破角色,破韧能防止扑满逃跑
  content: |-
    次元扑满节点(投资环境「经济过热」把奖励节点全换成这个)不会失败,但扑满是**逃走**而不是被打死的:
    输出不够它就直接跑,一头都抓不到(界面会提示「扑满正努力逃跑」)。
    有效手段有两种:
    1. **带基础伤害的羁绊**——这类羁绊自带的召唤物/连携攻击按「基础伤害」算,不依赖角色攻击力,
       所以哪怕角色星级低也能持续命中扑满。例如「云上五骁」的【五骁连携】、「持续伤害」的【深红荆棘】。
    2. **击破相关角色**——破韧能打断逃跑,把扑满按住(Break 类角色、击破羁绊)。
    反过来,纯靠 1 星角色平砍是抓不到猪的:与其上三个白板,不如上一个能触发基础伤害或破韧的角色。
  triggers:
    entities: [经济过热, 经济严重过热, 次元扑满, 扑满]
  scope: [战术, 选择]
  status: approved
  confidence: high
  source: 维护者(2026-11-16)告知;2026-11-16 在 A8-20 实机验证过"1 星白板抓不到扑满"这一半
  evidence: ["2026-11-16 A8-20 对局 1-1、1-2:3 个 1 星打扑满,两次进度都是 0%,提示「扑满正努力逃跑」"]

- id: m-20261116-affix-plane1-buff
  kind: 打法
  title: 「第一位面强化」让第一位面的怪更肉,经济要多投在过渡阵容上
  content: |-
    怪物词条「第一位面强化」让第一位面的敌人速度和生命上限都提高,第一位面的战斗明显更难打。
    这时不能按平常的节奏存钱等后期:要把更多金币花在过渡阵容上(早点升人口、买能马上上场的角色、刷出能升星的牌),
    先保住第一位面的血量。位面详情底部的词条说明会写出具体数值。
  triggers:
    entities: [第一位面强化]
  scope: [战略, 战术]
  status: approved
  confidence: medium
  source: 维护者(2026-11-16)告知

- id: m-20261116-affix-retaliate
  kind: 打法
  title: 「忍无可忍」让敌人受击几次后就行动,挨打次数更多,要多上生存
  content: |-
    怪物词条「忍无可忍」让敌人受击一定次数后行动,我方挨打的次数比平常多,阵亡风险变大(阵亡一次扣 35 行动值)。
    这时要多上生存位(护盾、治疗、能站前台分摊伤害的角色),给前台挨打的角色配生存装备。
    看词条压力的思路相同:带来输出压力的词条要加强输出,带来生存压力的词条要加强生存。
  triggers:
    entities: [忍无可忍]
  scope: [战略, 战术]
  status: approved
  confidence: medium
  source: 维护者(2026-11-16)告知

- id: m-20261118-rail-shop-refresh
  kind: 机制
  title: 开拓商店不会自动刷新,买「全部刷新」才整店换,买下一件只换那一格
  content: |-
    开拓银轨的开拓商店(用开拓力买)里的商品不会随回合或节点自动刷新。
    只有两种情况会换商品:买下「全部刷新」这件商品,整个商店换一批;买下某一件商品,只有那一格换成新商品。
    所以这次不买的商品之后打开还在,不用急着买;想看新商品就买「全部刷新」,或者先买下别的格子的东西让那一格换新。
  triggers:
    entities: [开拓商店, 开拓银轨, 全部刷新]
    screens: [rail_shop]
  scope: [选择, 战术]
  status: approved
  confidence: high
  source: 维护者(2026-11-18)告知
  evidence: [20261119-192110_deepseek-v4.1-flash/151-153]   # 实机买过「全部刷新」

