- id: m-20261120-key-equip-bindings
  kind: 打法
  title: 常用启动与易伤装有固定高配对象:弹射器给先手拐、蓄能帆给花火、永动机给昔涟、钻地弹给后台群攻拐
  content: |-
    跨体系高频功能装的常见归属:
    - 电磁弹射器(开局行动提前 100%):优先给需要开局先手挂增益或拉条的辅助(刻律德菈、星期日、知更鸟)。
    - 蓄能帆:优先给耗能大户和拉条核心(花火、雪衣、爻光),保证大招循环。
    - 永动机:昔涟头号功能装,昔涟到手前可先给知更鸟打工再转。
    - 行星钻地弹(35% 易伤):最配后台高频群攻拐(千冶•刃、缇宝)。
    - 火力风暴潮:通吃高频多动/直伤主 C,但阿哈时刻每次只叠 1 层,不推荐给阿哈带。
