- id: m-20261120-invest-econ-and-check
  kind: 打法
  title: 前中期投资优先经济与装备滚雪球;定体系前先核对本局条件与试用限制
  content: |-
    除特定星徽体系急需钻石或邀请外,前中期选投资环境和投资策略时,经济类与装备/宝石类滚雪球收益普遍高于过早拿小幅战力(如长线利好、彩虹时代、人才下沉、火药味、红/蓝钻贵族、好运来、采购专员、自由市场、公司军火更新、定期福利、利息上调、本金充裕)。
    定型前先核对本局条件:星核猎手看剧本装备是否适配主 C,黄金大饭店看今日菜单,星徽玩法看开局有没有对应钻或环境;选吃练度或奇缘星魂的主 C 前先看卡面是否标着「试用」(试用角色没有奇缘星魂,标着试用时应避开刚需奇缘星魂或高星魂的玩法)。
  triggers:
    screens: [environment_choice, strategy_choice]
  scope: [战略]
  status: approved
