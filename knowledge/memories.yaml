- id: m-20261120-flex-supports-and-survival
  kind: 打法
  title: 高难输出装够用后优先补团队生存装和万金油通拐(千冶•刃、风堇、藿藿、符玄、缇宝、雪衣)
  content: |-
    阵容已有核心框架、后期多出人口位时,优先补跨体系万金油通拐和生存位:
    - 万金油通拐:千冶•刃(后台按全队装备数强化主 C 兼挂易伤/生存装)、缇宝(全队幸运伤与高频追击)、昔涟(配永动机激活全后台大招与真伤)、寒鸦(后台提速与易伤)、雪衣(大招锁倒计时防超时)、不死途(大后期任命前台主 C)。
    - 通用生存位:风堇、藿藿、符玄(前期打工奶优先白露、真珠、灵砂)。高难单靠 1 个无装备生存位往往保不住,通常需要双生存位或生存位配团队生存装(绝对热量、痛觉阻断芯片、生命之环、很硬的甲、掩体生成枪);主 C 输出装够用后,多余散件优先合团队生存装而非塞给无关副 C。
