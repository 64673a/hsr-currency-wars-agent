# 货币战争消耗品(右上角道具栏)。官方文案来自游戏解包数据;维护者确认 S1、S2 的道具没有变化(2026-11-17),
# S2 另有绑定羁绊的变体(开拓·、阿哈·、幻月·、奇美拉投影仪、奇巧零食)。
# 来源:static.nanoka.cc/hsr/4.7.51/zh|en/currency/item.json(type=Consumable),与 FortOfFans/HSRMaps
# chs/modes/currencywars/GridFightConsumables.json 的 ConsumableDesc 一致(2026-11-17 取)。
# 图标:src/cwagent/assets/items/<id>.png(Fandom 英文 wiki「Equipment <英文名>.png」,128px;开拓·、阿哈·六种变体 wiki 上没有)。
# rule:游戏里的道具规则类型;params:Copy 是 [费用上限, 复制星级(, 限定羁绊 id)],UpgradeByRefresh 是 [初始次数, 每刷新几次 +1]。
# stack:同名能否叠放;consume:用后是否消失。
- id: 350101
