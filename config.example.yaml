# 配置示例:复制为 config.yaml 后修改(config.yaml 含 API key,不入库)。
# 字段说明见 docs/TECH_DESIGN.md 第 11.2 节。agent 本体尚未实现,此文件是配置格式草案。

# 模型档案:每个档案 = 格式 + 地址 + key + 模型名,其余参数原样透传给接口。
models:
  - name: claude-opus
    format: anthropic                # anthropic | openai
    base_url: https://api.anthropic.com
    api_key: ""
    model: claude-opus-5-5
    max_tokens: 16000                # anthropic 格式必填
    extra_body:                      # 原样合并进请求体
      thinking: {type: adaptive, display: summarized}   # 返回思考摘要
      output_config: {effort: medium}
    extra_headers: {}
    tool_mode: native                # native | json(不支持工具调用的模型用 json)
    timeout_seconds: 300

  - name: openai-compatible
    format: openai
    base_url: https://api.example.com/v1
    api_key: ""
    model: your-model-id
    extra_body: {reasoning_effort: high}
    tool_mode: native

# 各决策层使用的模型档案(填上面的 name)
roles:
  tactical: claude-opus
  strategic: claude-opus
  chooser: claude-opus
  review: claude-opus

agent:
  use_guides: true                   # 是否给模型看官方阵容指引卡
  max_tactical_calls_per_stage: 3
  max_run_minutes: 120
